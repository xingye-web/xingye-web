# ---- 星野 Ark 加固站点 · Nginx 方案 ----
# 放到 /etc/nginx/conf.d/xingye-ark.conf（按需调整证书与域名）

upstream arksafe_upstream {
    server ark.yunzhuru.cn:443;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name your-domain.com;          # ← 改成你自己的域名

    # ssl_certificate     /etc/nginx/ssl/your-domain.pem;
    # ssl_certificate_key /etc/nginx/ssl/your-domain.key;

    root  /var/www/xingye-ark;               # ← index.html / images / language 所在目录
    index index.html;

    # 大文件上传：加固底包可能较大，放宽限制并关闭请求缓冲以支持流式上传
    client_max_body_size 0;
    proxy_request_buffering off;

    # 静态前端
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 语言包（本地静态，index.php 实为静态 JSON 导出）
    location /language/ {
        try_files $uri $uri/ =404;
        default_type application/json;
    }

    # 关键：/api/ 反向代理到上游加固接口（保持同域，绕开浏览器跨域限制）
    location /api/ {
        proxy_pass https://ark.yunzhuru.cn/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host ark.yunzhuru.cn;
        proxy_set_header X-Real-IP $remote_addr;

        # 上传/加固耗时较长
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}

# HTTP 跳转 HTTPS
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}
