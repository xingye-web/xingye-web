  .brand-title {

  }

  .brand-tag {
    font-size: 0.65rem;

    background: rgba(255, 255, 255, 0.9);

  }

  .version-text {

  }

  .get-btn {
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    color: #6d5bd0;
    background: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 10px 24px;
    box-shadow: 0 2px 10px rgba(109, 91, 208, 0.08);
    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
  }

  .get-btn:active {
    transform: scale(0.96);
  }

  /* ============ 主内容区 ============ */
  .main-content {
    padding: 16px 20px 16px;
  }

  .hero-title {

  /* ============ 截图预览区 ============ */
  .screenshot-section {
    background: #f2f4f7;

    padding: 16px;
    display: flex;
    gap: 14px;
    height: 520px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  /* 左侧缩略图列表 */
  .thumb-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 86px;
    flex-shrink: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scroll-behavior: smooth;
  }

  /* 缩略图尺寸 */
  .thumb-item {
    width: 86px;
    height: 162px;
    border-radius: 10px;
    overflow: hidden;
    border: 2.5px solid transparent;
    background: #fff;
    padding: 0;
    cursor: pointer;
    transition: border-color 0.2s ease;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    -webkit-tap-highlight-color: transparent;
    appearance: none;
    font: inherit;
  }

  .thumb-item:focus-visible { outline: 2px solid #0070e0; outline-offset: 2px; }
  .thumb-item.active { border-color: #0070e0; }

  .thumb-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  /* 右侧主预览图 */
  .main-preview {
    flex: 1;
    min-width: 0;
    border-radius: 14px;
    overflow: hidden;
    background: #ffffff;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);

  .main-preview img {

    height: 100%;
    object-fit: contain;

    opacity: 1;
    transition: opacity 0.18s ease;
  }
  .main-preview img.is-fading { opacity: 0; }

  /* ============ 底部按钮 ============ */

  <script>
    (function () {
      'use strict';

      var mainPreviewImg = document.getElementById('mainPreviewImg');
      var thumbs = Array.prototype.slice.call(document.querySelectorAll('.thumb-item'));
      var currentIndex = 0;

      function selectThumb(el, index) {
        if (el === thumbs[currentIndex]) return;
        currentIndex = index;

        thumbs.forEach(function (x, i) {
          var on = x === el;
          x.classList.toggle('active', on);
          x.setAttribute('aria-selected', on ? 'true' : 'false');
        });

        var img = el.querySelector('img');
        if (!img || !mainPreviewImg) return;

        mainPreviewImg.classList.add('is-fading');
        var preload = new Image();
        var done = function () {
          mainPreviewImg.src = img.src;
          mainPreviewImg.alt = img.alt.replace('截图', '主界面预览');
          mainPreviewImg.classList.remove('is-fading');
        };
        preload.onload = done;
        preload.onerror = done;
        preload.src = img.src;

        if (el.scrollIntoView) {
          el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      }

      thumbs.forEach(function (t, i) {
        t.addEventListener('click', function () { selectThumb(this, i); });
      });

      document.querySelector('.thumb-list').addEventListener('keydown', function (e) {
        var next = null;
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next = Math.min(currentIndex + 1, thumbs.length - 1);
        else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') next = Math.max(currentIndex - 1, 0);
        if (next !== null && next !== currentIndex) {
          e.preventDefault();
          thumbs[next].focus();
          selectThumb(thumbs[next], next);
        }
      });

      if (mainPreviewImg) {
        mainPreviewImg.addEventListener('error', function () {
          this.classList.remove('is-fading');
        });
      }

      var getBtn = document.getElementById('getBtn');
      var downloadBtn = document.getElementById('downloadBtn');
      if (getBtn && downloadBtn) {
        getBtn.addEventListener('click', function () {
          window.location.href = downloadBtn.getAttribute('href');
        });
      }
    })();
  </script>
